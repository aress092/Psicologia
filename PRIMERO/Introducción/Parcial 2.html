  <script>
    const QUESTIONS = [
      { id: 1, block: 'Percepción', q: 'La prosopagnosia se caracteriza por:', opts: ['La incapacidad para detectar cambios de brillo y color.', 'La pérdida de visión nocturna por alteración retiniana.', 'La incapacidad para percibir y reconocer rostros familiares.'], ans: 2, exp: 'Ejemplo clásico de diferencia entre sensación y percepción (asociada al giro fusiforme, FFA).' },
      { id: 2, block: 'Percepción', q: '¿Qué diferencia al procesamiento bottom-up del top-down?', opts: ['El bottom-up corresponde a la sensación y el top-down a la percepción interpretativa.', 'El bottom-up depende de las expectativas previas y el top-down de los receptores.', 'Ambos procesos ocurren únicamente en la retina antes del nervio óptico.'], ans: 0, exp: 'Sensación = entrada sensorial de abajo a arriba (bottom-up); Percepción = interpretación de arriba a abajo (top-down).' },
      { id: 3, block: 'Percepción', q: 'El umbral absoluto se define como:', opts: ['El cambio mínimo entre dos estímulos detectable la mitad de las veces.', 'La cantidad mínima de energía física detectable la mitad de las veces.', 'La intensidad máxima que soporta un receptor sin saturarse.'], ans: 1, exp: 'El cambio más pequeño entre dos estímulos es el umbral diferencial.' },
      { id: 4, block: 'Percepción', q: 'Según la Ley de Weber:', opts: ['El incremento necesario para notar un cambio es siempre una constante fija.', 'La sensibilidad aumenta cuando se reduce la longitud de onda del estímulo.', 'El incremento necesario para notar un cambio es proporcional a la intensidad inicial.'], ans: 2, exp: 'A mayor intensidad inicial, mayor incremento hace falta para notar la diferencia.' },
      { id: 5, block: 'Percepción', q: 'En las ondas de luz, la longitud de onda y la amplitud determinan respectivamente:', opts: ['El color y el brillo.', 'El brillo y el color.', 'La agudeza visual y la profundidad.'], ans: 0, exp: 'Longitud de onda = color (400–700 nm); Amplitud = brillo.' },
      { id: 6, block: 'Percepción', q: '¿Qué es la transducción?', opts: ['El cruce de fibras visuales en el quiasma óptico.', 'La conversión de energía física en señales neuronales en los receptores.', 'La corrección automática de la perspectiva en la corteza visual.'], ans: 1, exp: 'El cerebro solo procesa señales neuronales, no energía física directa.' },
      { id: 7, block: 'Percepción', q: '¿Cuál describe correctamente a los bastones frente a los conos?', opts: ['Los bastones se ubican en la periferia, operan con poca luz y dan visión acromática.', 'Los bastones se concentran en la fóvea, operan con luz brillante y dan visión en color.', 'Los conos se ubican en la periferia, operan con poca luz y tienen baja agudeza.'], ans: 0, exp: 'Bastones (~120 M): periferia, poca luz, sin color, baja agudeza. Conos (~6 M): fóvea, luz brillante, color, alta agudeza.' },
      { id: 8, block: 'Percepción', q: '¿Qué estructura del ojo enfoca la luz sobre la retina?', opts: ['La córnea.', 'La pupila.', 'El cristalino.'], ans: 2, exp: 'Córnea: membrana protectora frontal; Pupila: abertura del iris; Cristalino: enfoca en la retina.' },
      { id: 9, block: 'Percepción', q: 'Una dificultad clásica de la teoría tricromática es que:', opts: ['No contempla la existencia de conos sensibles a distintas longitudes de onda.', 'No explica las postimágenes de colores complementarios ni ciertas mezclas imposibles.', 'Solo puede aplicarse en condiciones de visión nocturna.'], ans: 1, exp: 'No explica las postimágenes ni por qué no vemos mezclas azul-amarillentas o rojo-verdosas; se complementa con el proceso oponente.' },
      { id: 10, block: 'Percepción', q: 'Según la teoría del proceso oponente:', opts: ['Cada área cortical procesa un único color de forma aislada.', 'Los colores se perciben solo por suma directa de los tres conos sin inhibición.', 'Existen pares de colores opuestos en los que estimular uno inhibe al otro.'], ans: 2, exp: 'Sistemas rojo–verde, azul–amarillo y negro–blanco en células ganglionares, tálamo y corteza visual.' },
      { id: 11, block: 'Percepción', q: 'El punto ciego del ojo es:', opts: ['La zona de la retina sin fotorreceptores por donde sale el nervio óptico.', 'La zona de la fóvea con mayor concentración de conos.', 'El área del tálamo donde se cruzan las fibras visuales.'], ans: 0, exp: 'Al no haber bastones ni conos en la salida del nervio óptico, no se detecta luz en ese punto.' },
      { id: 12, block: 'Percepción', q: 'Tras el cruce parcial de fibras en el quiasma óptico:', opts: ['La corteza visual derecha procesa el hemicampo visual derecho.', 'La corteza visual derecha procesa el hemicampo visual izquierdo y viceversa.', 'Toda la información de ambos ojos llega sin cruzarse a la corteza izquierda.'], ans: 1, exp: 'El procesamiento de los hemicampos visuales es contralateral.' },
      { id: 13, block: 'Percepción', q: 'Hubel y Wiesel descubrieron:', opts: ['La ilusión de las mesas de perspectiva.', 'El fenómeno de la ceguera al cambio.', 'Las células detectoras de características en la corteza visual.'], ans: 2, exp: 'Neuronas especializadas en detectar rasgos concretos como líneas horizontales o verticales.' },
      { id: 14, block: 'Percepción', q: 'En el procesamiento modular, ¿qué procesan MT/V5 y el área LOC?', opts: ['MT/V5 procesa el movimiento y LOC el reconocimiento de objetos.', 'MT/V5 procesa el color y LOC el reconocimiento de rostros.', 'MT/V5 procesa los bordes básicos y LOC el contraste lumínico.'], ans: 0, exp: 'V1: bordes/contraste; V4: color; MT/V5: movimiento; FFA: rostros; LOC: objetos.' },
      { id: 15, block: 'Percepción', q: 'En el problema de la integración, ¿qué mecanismos intervienen?', opts: ['Solo convergencia ocular y disparidad retiniana.', 'Organización espacial, interacciones entre áreas visuales y atención.', 'Exclusivamente la transducción en células bipolares.'], ans: 1, exp: 'Estos tres mecanismos combinan las características procesadas en paralelo para percibir un objeto único.' },
      { id: 16, block: 'Percepción', q: 'El efecto Margaret Thatcher demuestra que:', opts: ['Reconocemos mejor los rostros invertidos que los orientados normalmente.', 'El giro fusiforme solo se activa ante objetos geométricos simples.', 'El reconocimiento facial depende de la configuración global de la cara.'], ans: 2, exp: 'Al invertir el rostro cuesta detectar rasgos alterados porque se rompe el procesamiento configuracional global.' },
      { id: 17, block: 'Percepción', q: 'En el efecto contextual de Bruner y Minturn:', opts: ['Un mismo símbolo ambiguo cambia su interpretación según aparezca entre letras o números.', 'Dos líneas del mismo tamaño parecen distintas por perspectiva lineal.', 'Una figura reversible alterna entre una copa y dos perfiles.'], ans: 0, exp: 'El símbolo ambiguo se percibe como «B» entre letras y como «13» entre números.' },
      { id: 18, block: 'Percepción', q: 'Completar mentalmente las partes que faltan en una figura corresponde al principio Gestalt de:', opts: ['Proximidad.', 'Cierre.', 'Continuidad.'], ans: 1, exp: 'El principio de cierre permite percibir formas completas aunque falten fragmentos.' },
      { id: 19, block: 'Percepción', q: '¿Cuáles son señales binoculares de profundidad?', opts: ['Perspectiva lineal y superposición.', 'Gradiente de textura y tamaño relativo.', 'Disparidad retiniana y convergencia ocular.'], ans: 2, exp: 'Disparidad retiniana (~6 cm) y convergencia ocular requieren ambos ojos; las demás son monoculares.' },
      { id: 20, block: 'Percepción', q: 'La ilusión de Adelson sobre luminosidad muestra que:', opts: ['El brillo percibido depende del contexto y de inferencias sobre la iluminación.', 'El brillo percibido depende únicamente de la cantidad física de luz en la retina.', 'La constancia de tamaño impide percibir sombras en superficies planas.'], ans: 0, exp: 'El sistema visual compensa la presencia de sombra al estimar la claridad de una superficie.' },

      { id: 21, block: 'Atención', q: 'La ceguera por inatención consiste en:', opts: ['La dificultad para recordar palabras tras una tarea distractora.', 'No percibir un estímulo inesperado pero visible cuando la atención está ocupada en otra tarea.', 'La pérdida temporal de agudeza tras un destello periférico.'], ans: 1, exp: 'Demostrada por Daniel Simons (Monkey Business Illusion): la tarea principal absorbe los recursos.' },
      { id: 22, block: 'Atención', q: 'La ceguera al cambio ocurre con mayor facilidad cuando:', opts: ['Se presentan dos mensajes auditivos simultáneos en ambos oídos.', 'La carga perceptiva de la tarea principal es nula.', 'Hay una breve interrupción visual que dificulta detectar la modificación.'], ans: 2, exp: 'Tras un parpadeo o corte de escena cuesta detectar cambios sin una pista atencional.' },
      { id: 23, block: 'Atención', q: 'En escucha dicótica, ¿qué suele captar el sujeto del oído NO atendido?', opts: ['Cambios físicos de la voz y estímulos muy relevantes como el propio nombre.', 'Todo el significado semántico del mensaje secundario con precisión.', 'Absolutamente nada, ni siquiera cambios de tono o idioma.'], ans: 0, exp: 'Se recuerda poco contenido semántico, pero sí rasgos físicos y el propio nombre (efecto cóctel party).' },
      { id: 24, block: 'Atención', q: 'Según el modelo de filtro rígido de Broadbent:', opts: ['Todos los mensajes se analizan semánticamente antes de ser filtrados.', 'La selección es temprana por rasgos físicos y bloquea el mensaje no atendido.', 'El filtro atenúa el mensaje no atendido dejando pasar palabras frecuentes.'], ans: 1, exp: 'Broadbent (1958): selección temprana y bloqueo total antes del análisis semántico.' },
      { id: 25, block: 'Atención', q: '¿Qué propone el modelo de filtro atenuado de Treisman?', opts: ['Que la selección ocurre después de emitir la respuesta motora.', 'Que la capacidad atencional es ilimitada en tareas auditivas.', 'Que el filtro debilita el mensaje no atendido sin bloquearlo por completo.'], ans: 2, exp: 'Treisman (1964): así los estímulos con umbral bajo, como el propio nombre, pueden reconocerse.' },
      { id: 26, block: 'Atención', q: 'En el modelo de filtro tardío de Deutsch y Deutsch:', opts: ['Todos los estímulos reciben análisis semántico y la selección ocurre después.', 'Solo el canal atendido recibe procesamiento perceptivo y semántico.', 'La selección depende exclusivamente de características físicas del sonido.'], ans: 0, exp: 'Deutsch y Deutsch (1963): el filtro selecciona tras el análisis semántico para guiar conciencia y respuesta.' },
      { id: 27, block: 'Atención', q: 'Según la teoría de la carga perceptiva de Lavie, ¿cuándo hay MAYOR distracción?', opts: ['Con alta carga perceptiva, porque la tarea agota la capacidad.', 'Con baja carga perceptiva, porque sobran recursos que procesan los distractores.', 'La carga perceptiva no afecta al procesamiento de distractores.'], ans: 1, exp: 'Con baja carga sobran recursos atencionales que se destinan involuntariamente a los distractores.' },
      { id: 28, block: 'Atención', q: 'En el modelo de capacidad de Kahneman sobre atención dividida:', opts: ['La capacidad atencional es fija e independiente de la activación.', 'Dos tareas simultáneas nunca interfieren si usan modalidades distintas.', 'La capacidad es limitada, varía con la activación y la práctica reduce la interferencia.'], ans: 2, exp: 'Kahneman (1973): si la demanda supera la capacidad disponible aparece interferencia.' },
      { id: 29, block: 'Atención', q: 'La orientación espacial exógena se induce típicamente mediante:', opts: ['Señales periféricas salientes o repentinas.', 'Señales centrales que requieren interpretación simbólica.', 'Instrucciones verbales previas sobre expectativas.'], ans: 0, exp: 'Exógena = involuntaria (ej. destello periférico); Endógena = voluntaria (ej. flecha central).' },
      { id: 30, block: 'Atención', q: 'En el paradigma de cueing espacial de Posner:', opts: ['El tiempo de reacción es mayor en ensayos válidos que en inválidos.', 'El tiempo de reacción es menor en ensayos válidos y demuestra orientación encubierta.', 'Solo funciona si el participante mueve los ojos hacia la pista.'], ans: 1, exp: 'TR válido < TR inválido: atender a una ubicación facilita y acelera el procesamiento sin mover los ojos.' },
      { id: 31, block: 'Atención', q: 'Según Anne Treisman, en una búsqueda por conjunción de características:', opts: ['El objetivo destaca en paralelo y el tiempo de reacción es constante.', 'No interviene la atención focalizada en ninguna fase de la búsqueda.', 'Se requiere atención serial y el tiempo de reacción crece con el número de elementos.'], ans: 2, exp: 'Característica distintiva (pop-out) = paralelo y TR plano; Conjunción = serial y TR creciente.' },
      { id: 32, block: 'Atención', q: 'El efecto Stroop ilustra:', opts: ['El conflicto entre un proceso automático y un proceso controlado.', 'La superioridad de la memoria icónica frente a la ecoica.', 'El fenómeno de la punta de la lengua en tareas verbales.'], ans: 0, exp: 'La lectura automatizada de la palabra interfiere con la tarea controlada de nombrar el color de la tinta.' },
      { id: 33, block: 'Atención', q: 'Según Posner, las tres redes atencionales son:', opts: ['Codificación, almacenamiento y recuperación.', 'Alerta, orientación y control ejecutivo.', 'Selección temprana, atenuación y filtro tardío.'], ans: 1, exp: 'Alerta (vigilancia), Orientación (selección espacial/fuente) y Control ejecutivo (resolución de conflictos).' },

      { id: 34, block: 'Memoria', q: 'La amnesia anterógrada consiste en:', opts: ['La pérdida exclusiva de recuerdos previos a la lesión.', 'La incapacidad para aprender únicamente habilidades motoras.', 'La incapacidad para consolidar nuevos recuerdos duraderos tras la lesión.'], ans: 2, exp: 'Retrógrada = lo previo a la lesión; Anterógrada = nuevos recuerdos en la MLP.' },
      { id: 35, block: 'Memoria', q: 'Los casos de Clive Wearing y H. M. demuestran una disociación porque presentaban:', opts: ['Amnesia declarativa grave con aprendizaje procedimental preservado.', 'Memoria declarativa intacta con pérdida total de la memoria procedimental.', 'Pérdida exclusiva de la memoria sensorial icónica.'], ans: 0, exp: 'Podían tocar el piano o mejorar en el dibujo en espejo sin recordar haberlo hecho.' },
      { id: 36, block: 'Memoria', q: '¿Qué aportó Baddeley al modelo multialmacén de Atkinson y Shiffrin?', opts: ['Eliminó por completo la memoria sensorial del modelo.', 'Sustituyó la MCP pasiva por la Memoria de Trabajo como sistema activo.', 'Limitó la capacidad de la memoria a largo plazo.'], ans: 1, exp: 'Baddeley (2001): la Memoria de Trabajo mantiene y manipula información temporalmente.' },
      { id: 37, block: 'Memoria', q: 'En el experimento de Sperling sobre memoria icónica:', opts: ['El informe completo permite recordar todas las letras de la matriz.', 'La memoria icónica se mantiene activa más de medio minuto sin repaso.', 'El informe parcial muestra que toda la matriz estuvo disponible brevemente.'], ans: 2, exp: 'Con informe parcial se recuerda ~100 % de la fila indicada (< 1 s), frente a ~4,5 letras en informe completo.' },
      { id: 38, block: 'Memoria', q: 'La Memoria a Corto Plazo se caracteriza por:', opts: ['Capacidad de 7 ± 2 chunks y duración inferior a 30 segundos sin repaso.', 'Capacidad de 20 ± 5 chunks y duración de varias horas sin repaso.', 'Capacidad ilimitada y duración inferior a 1 segundo.'], ans: 0, exp: 'Evaluada con test de span y tarea distractora de Brown-Peterson.' },
      { id: 39, block: 'Memoria', q: 'En el efecto de posición serial en recuerdo libre:', opts: ['La primacía refleja la MCP y la recencia la memoria sensorial.', 'La primacía refleja el paso a la MLP y la recencia la permanencia en la MCP.', 'Los ítems del centro de la lista son siempre los mejor recordados.'], ans: 1, exp: 'Una tarea distractora final elimina el efecto de recencia, pero no el de primacía.' },
      { id: 40, block: 'Memoria', q: 'Dentro de la MLP explícita, la memoria semántica almacena:', opts: ['Experiencias autobiográficas situadas en un momento concreto.', 'Hábitos motores y rutinas automatizadas.', 'Conocimientos generales del mundo, conceptos y lenguaje.'], ans: 2, exp: 'Episódica = vivencias personales; Semántica = conocimiento general.' },
      { id: 41, block: 'Memoria', q: '¿Qué sistemas forman parte de la memoria implícita?', opts: ['Memoria procedimental, condicionamiento clásico y priming.', 'Memoria episódica y memoria semántica.', 'Memoria icónica y memoria de trabajo.'], ans: 0, exp: 'La memoria implícita (no declarativa) se expresa de forma automática e inconsciente.' },
      { id: 42, block: 'Memoria', q: 'Según los niveles de procesamiento de Craik y Lockhart, ¿qué orden va de peor a mejor recuerdo?', opts: ['Semántico, fonológico y estructural.', 'Estructural, fonológico y semántico.', 'Fonológico, estructural y semántico.'], ans: 1, exp: 'Estructural (~25 %) < Fonológico (~55 %) < Semántico (~80 %).' },
      { id: 43, block: 'Memoria', q: '¿Qué diferencia la repetición de mantenimiento de la elaborativa?', opts: ['La de mantenimiento garantiza una consolidación permanente en la MLP.', 'No existe diferencia funcional entre ambos tipos de repetición.', 'La de mantenimiento sostiene en MCP y la elaborativa conecta con la MLP.'], ans: 2, exp: 'La repetición elaborativa relaciona la información nueva con conocimientos previos y crea más pistas.' },
      { id: 44, block: 'Memoria', q: 'El experimento de los buzos de Godden y Baddeley apoya la especificidad de codificación porque:', opts: ['Recordaron más palabras cuando coincidió el contexto ambiental de aprendizaje y recuerdo.', 'Recordaron igual con independencia del medio en el que estudiaron.', 'Solo lograron recordar las listas aprendidas bajo el agua.'], ans: 0, exp: 'Playa–playa o agua–agua superó a las condiciones con cambio de contexto.' },
      { id: 45, block: 'Memoria', q: '¿En qué consiste el reaprendizaje como forma de acceso?', opts: ['En recuperar información sin ninguna pista externa.', 'En medir el ahorro de tiempo o ensayos al volver a aprender algo olvidado.', 'En seleccionar la respuesta correcta entre varias opciones.'], ans: 1, exp: 'Recuerdo = sin pistas; Reconocimiento = con pistas; Reaprendizaje = ahorro.' },
      { id: 46, block: 'Memoria', q: 'Según la curva del olvido de Ebbinghaus:', opts: ['El olvido avanza de forma lineal y uniforme a lo largo de los días.', 'Durante las primeras horas no se olvida prácticamente nada.', 'La pérdida es muy rápida al principio y después se estabiliza.'], ans: 2, exp: 'Se pierde hasta ~50 % en la primera hora y se estabiliza hacia los ~2 días.' },
      { id: 47, block: 'Memoria', q: 'El estudio de Nickerson y Adams sobre los detalles de una moneda ejemplifica:', opts: ['El fallo de codificación por falta de atención inicial.', 'La interferencia retroactiva entre estímulos visuales.', 'La amnesia retrógrada de origen orgánico.'], ans: 0, exp: '«Pseudo-olvido»: no se olvida lo que nunca llegó a codificarse con detalle.' },
      { id: 48, block: 'Memoria', q: 'Si aprender un número nuevo te dificulta recordar tu número antiguo, estamos ante:', opts: ['Interferencia proactiva.', 'Interferencia retroactiva.', 'Repetición elaborativa.'], ans: 1, exp: 'Proactiva = lo antiguo estorba a lo nuevo; Retroactiva = lo nuevo estorba a lo antiguo.' },
      { id: 49, block: 'Memoria', q: 'El fenómeno de la «punta de la lengua» es un ejemplo de:', opts: ['Amnesia anterógrada transitoria.', 'Procesamiento preatencional en paralelo.', 'Fallo de recuperación dependiente de pistas.'], ans: 2, exp: 'La información está almacenada en la MLP, pero faltan las claves (cues) adecuadas.' },
      { id: 50, block: 'Memoria', q: 'Los trabajos de Bartlett y Elizabeth Loftus demuestran que la memoria es reconstructiva porque:', opts: ['Los esquemas previos y la desinformación posterior pueden transformar o distorsionar el recuerdo.', 'Almacena los hechos de forma literal e inalterable como una grabación.', 'Las distorsiones solo aparecen en pacientes con daño hipocampal.'], ans: 0, exp: 'Bartlett («La guerra de los fantasmas»): reducción, normalización y adiciones; Loftus: efecto de desinformación.' }
    ];

    let currentBlock = 'Todos';
    let deck = [...QUESTIONS];
    let idx = 0;
    let answers = {};
    let reviewMistakesMode = false;

    const elFilters = document.getElementById('filters');
    const elScore = document.getElementById('score-badge');
    const elProgress = document.getElementById('progress-bar');
    const elStage = document.getElementById('stage');
    const elCounter = document.getElementById('counter');
    const elBtnPrev = document.getElementById('btn-prev');
    const elBtnNext = document.getElementById('btn-next');
    const elBtnMistakes = document.getElementById('btn-mistakes');
    const elBtnShuffle = document.getElementById('btn-shuffle');
    const elBtnReset = document.getElementById('btn-reset');
    const blocks = ['Todos', 'Percepción', 'Atención', 'Memoria'];

    function getMistakes() {
      return QUESTIONS.filter(q => answers[q.id] !== undefined && answers[q.id] !== q.ans);
    }

    function updateStats() {
      const ids = Object.keys(answers);
      const correct = ids.filter(id => {
        const q = QUESTIONS.find(x => x.id === Number(id));
        return q && answers[id] === q.ans;
      }).length;
      elScore.textContent = `Aciertos: ${correct}/${ids.length}`;

      const mistakes = getMistakes();
      if (mistakes.length > 0 && !reviewMistakesMode) {
        elBtnMistakes.style.display = 'inline-block';
        elBtnMistakes.textContent = `Repasar fallos (${mistakes.length})`;
      } else {
        elBtnMistakes.style.display = 'none';
      }
    }

    function renderFilters() {
      elFilters.innerHTML = '';
      blocks.forEach(b => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = b;
        btn.className = (!reviewMistakesMode && currentBlock === b) ? 'pill active' : 'pill';
        btn.onclick = () => {
          reviewMistakesMode = false;
          currentBlock = b;
          deck = b === 'Todos' ? [...QUESTIONS] : QUESTIONS.filter(q => q.block === b);
          idx = 0;
          render();
        };
        elFilters.appendChild(btn);
      });
    }

    function renderQuestion() {
      const q = deck[idx];
      const chosen = answers[q.id];
      const isAnswered = chosen !== undefined;
      const letters = ['a', 'b', 'c'];

      elProgress.style.width = `${Math.round(((idx + 1) / deck.length) * 100)}%`;
      elCounter.textContent = `${idx + 1} / ${deck.length}`;
      elBtnPrev.disabled = idx === 0;
      elBtnNext.textContent = idx === deck.length - 1 ? 'Ver resumen →' : 'Siguiente →';

      const card = document.createElement('div');
      card.className = 'q-card';

      const meta = document.createElement('div');
      meta.className = 'q-meta';
      meta.innerHTML = `<span>Bloque: <strong>${q.block}</strong></span><span>Pregunta #${q.id}</span>`;
      card.appendChild(meta);

      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = q.q;
      card.appendChild(qText);

      const optsWrap = document.createElement('div');
      optsWrap.className = 'opts';

      q.opts.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.disabled = isAnswered;
        let cls = 'opt-btn';
        if (isAnswered) {
          if (i === q.ans) cls += ' correct';
          else if (i === chosen) cls += ' wrong';
          else cls += ' dimmed';
        }
        btn.className = cls;
        btn.innerHTML = `<span class="opt-letter">${letters[i]})</span><span>${optText}</span>`;
        btn.onclick = () => {
          answers[q.id] = i;
          render();
        };
        optsWrap.appendChild(btn);
      });
      card.appendChild(optsWrap);

      if (isAnswered) {
        const ok = chosen === q.ans;
        const fb = document.createElement('div');
        fb.className = `feedback ${ok ? 'ok' : 'ko'}`;
        fb.innerHTML = `<strong>${ok ? 'Correcta.' : `Incorrecta (era la ${letters[q.ans]}).`}</strong> ${q.exp}`;
        card.appendChild(fb);
      }

      elStage.innerHTML = '';
      elStage.appendChild(card);
    }

    function renderSummary() {
      const answeredInDeck = deck.filter(q => answers[q.id] !== undefined);
      const correctInDeck = answeredInDeck.filter(q => answers[q.id] === q.ans).length;
      const mistakesInDeck = answeredInDeck.filter(q => answers[q.id] !== q.ans);
      const pct = answeredInDeck.length ? Math.round((correctInDeck / answeredInDeck.length) * 100) : 0;

      elStage.innerHTML = `
        <div class="q-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
            <strong>Resultado (${reviewMistakesMode ? 'Repaso de fallos' : currentBlock})</strong>
            <span class="score-pill">${correctInDeck} / ${answeredInDeck.length} (${pct}%)</span>
          </div>
          <p style="font-size:0.9rem;color:#555;margin-bottom:0.9rem;">Respondidas: ${answeredInDeck.length} de ${deck.length}. Fallos en este bloque: ${mistakesInDeck.length}.</p>
          <div class="pill-group">
            ${mistakesInDeck.length > 0 ? `<button id="sum-mistakes" type="button" class="btn-warn">Repasar ${mistakesInDeck.length} fallo(s)</button>` : ''}
            <button id="sum-restart" type="button" class="btn-primary">Volver al inicio</button>
          </div>
        </div>
      `;
      elCounter.textContent = `Fin (${deck.length})`;
      elBtnNext.disabled = true;

      const btnSumMistakes = document.getElementById('sum-mistakes');
      if (btnSumMistakes) {
        btnSumMistakes.onclick = () => {
          reviewMistakesMode = true;
          deck = mistakesInDeck;
          mistakesInDeck.forEach(q => delete answers[q.id]);
          idx = 0;
          elBtnNext.disabled = false;
          render();
        };
      }
      document.getElementById('sum-restart').onclick = () => {
        idx = 0;
        elBtnNext.disabled = false;
        render();
      };
    }

    function render() {
      elBtnNext.disabled = false;
      renderFilters();
      updateStats();
      renderQuestion();
    }

    elBtnPrev.onclick = () => { if (idx > 0) { idx--; render(); } };
    elBtnNext.onclick = () => { if (idx < deck.length - 1) { idx++; render(); } else { renderSummary(); } };
    elBtnMistakes.onclick = () => {
      const m = getMistakes();
      if (!m.length) return;
      reviewMistakesMode = true;
      deck = [...m];
      m.forEach(q => delete answers[q.id]);
      idx = 0;
      render();
    };
    elBtnShuffle.onclick = () => {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      idx = 0;
      render();
    };
    elBtnReset.onclick = () => {
      answers = {};
      reviewMistakesMode = false;
      deck = currentBlock === 'Todos' ? [...QUESTIONS] : QUESTIONS.filter(q => q.block === currentBlock);
      idx = 0;
      render();
    };

    render();
  </script>
</body>
</html>
